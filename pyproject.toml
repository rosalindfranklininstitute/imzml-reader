[project]
name = "imzml-reader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Duncan McDougall", email = "duncan.mcdougall@rfi.ac.uk" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "argsui",
    "numpy>=2.4.6",
    "tqdm>=4.70.0",
    "fastdigest>=0.12.0",
    "xartus>=0.5.1",
    "pyimzml",
]

license = "LicenseRef-RFI-Apache-2.0-Commons-clause"
license-files = ["LICENSES/*"]

[dependency-groups]
dev = [
 "line-profiler>=5.0.2",
 "pytest>=9.1.1",
 "pytest-autoprofile>=0.19.0",
 "pytest-cov>=7.0.0",
 "nexus_pixel_man_test_data",
 "icecream>=2.2.0",
]

[tool.uv.sources]
nexus_pixel_man_test_data = { path = "../nexus_pixel_man_test_data/", editable = true }
pyimzml = { git = "https://github.com/rosalindfranklininstitute/pyimzML.git" }


[project.scripts]
main = "imzml_reader:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.line_profiler.kernprof]
line-by-line = true
verbose = false
skip-zero = true
prof-mod = ['./src/imzml_reader/', 'imzml_reader', '../xartus/src/xartus/', 'xartus']
prof-imports = false

[tool.ruff]
indent-width=4

[tool.ruff.lint]
select=['E1', 'E4','E7','E9','F','N','ERA', 'ANN2', 'S', 'BLE', 'B', 'A', 'C4', 'COM', 'ISC', 'ICN', 'LOG', 'PIE','RET', 'SLF','SIM', 'TD', 'ARG', 'PTH', 'FLY', 'NPY', 'PERF', "D2", "TRY", "PT"]
ignore=["C408", "S311", "PTH123", "NPY002", "D203", "D205", "D212", "B006", "ARG001", "ARG002", "D200", "ANN204", "S101", "TRY003", 'RET504', 'COM812']

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["ANN", "S101"]
